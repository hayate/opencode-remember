name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main
        # actions/checkout on a pull_request event checks out the merge ref
        # with no local origin/main branch ref at all, so anything comparing
        # against origin/main (tests/test_case_divergence_298.py's byte-pin
        # guard) cannot resolve its base and would otherwise have to skip
        # itself -- which is exactly how that guard went unexercised on
        # every pull_request run (#442). Fetch it explicitly and cheaply;
        # depth 1 is enough since only the tip of main is compared against.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Install Windows tzdata
        if: runner.os == 'Windows'
        run: pip install tzdata
      - name: Run tests
        run: pytest

  plugin-ts:
    # The OpenCode adapter's pure logic (plugin/lib.ts). Runs under plain
    # Node with type stripping; the Bun-specific glue (plugin/opencode-remember.ts)
    # is exercised by the smoke test against a real opencode install, not by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run plugin tests
        run: node --test plugin/lib.test.ts plugin/core.test.ts

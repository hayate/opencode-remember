name: Release

on:
  push:
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          TAG="$GITHUB_REF_NAME"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version v$PKG_VERSION"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::package.json version $PKG_VERSION does not match .claude-plugin/plugin.json version $PLUGIN_VERSION"
            exit 1
          fi
          echo "$PKG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::version $PKG_VERSION is not plain semver (prerelease tags publish with npm tag next)"
            exit 1
          }

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view opencode-remember@"$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
